<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop Replacement To-Do</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#202938;--muted:#687386;--line:#e2e7ef;--primary:#2457d6;--soft:#edf2ff}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab4c3;--line:#374151;--primary:#83a7ff;--soft:#293b60}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.container{max-width:1100px;margin:auto;padding:25px 18px 50px}
header,.task-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{margin-bottom:22px}
h1{font-size:25px;margin:0 0 6px}
.subtitle,.meta,.scan-help{color:var(--muted);font-size:13px}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}
.primary{background:var(--primary);color:white}
.secondary{background:var(--soft);color:var(--text)}
.danger{background:#ffe8e8;color:#b42323}
body.dark .danger{background:#512b32;color:#ffaaaa}
input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px}
textarea{resize:vertical;min-height:75px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat,.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}
.stat strong{display:block;font-size:25px;margin-top:5px}
.stat span{color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:17px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
.tasks{display:grid;gap:13px}
.task h3{margin:0 0 7px;font-size:17px}
.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:bold}
.pending{background:#fff2d8;color:#9a6500}
.completed{background:#dcfce7;color:#137342}
body.dark .pending{background:#514222;color:#ffdb83}
body.dark .completed{background:#17452e;color:#8af0b1}
.checklist{display:grid;gap:10px;margin:16px 0;padding:13px;background:var(--bg);border-radius:9px}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.checkline input{width:17px;height:17px;margin:0}
.serials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.serial{padding:10px;background:var(--bg);border-radius:8px;font-size:12px;overflow-wrap:anywhere}
.serial strong{display:block;margin-bottom:5px}
.notes{color:var(--muted);font-size:13px;white-space:pre-wrap;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{font-size:12px;padding:8px 11px}
.empty{text-align:center;padding:45px 15px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.modal-bg{display:none;position:fixed;inset:0;z-index:10;background:#0009;padding:15px;overflow:auto;align-items:flex-start;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:570px;margin:25px auto;background:var(--card);color:var(--text);border-radius:14px;padding:20px}
.modal h2{margin:0 0 18px;font-size:20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.serial-input{display:flex;gap:7px}
.serial-input input{min-width:0}
.serial-input button{white-space:nowrap;padding:9px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#reader{width:100%;margin-top:12px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.serials,.form-grid{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<div class="container">
<header>
<div><h1>Laptop Replacement To-Do</h1><div class="subtitle">Track laptop replacement and collection tasks</div></div>
<button class="secondary" id="themeBtn" onclick="toggleTheme()">Dark Mode</button>
</header>

<section class="stats">
<div class="stat"><span>Total Tasks</span><strong id="totalCount">0</strong></div>
<div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
<div class="stat"><span>Completed</span><strong id="completedCount">0</strong></div>
</section>

<div class="toolbar">
<button class="primary" onclick="openForm()">+ Add Task</button>
<input id="search" placeholder="Search colleague or task..." oninput="render()">
<select id="entityFilter" onchange="render()">
<option value="">All Entities</option><option>AIB</option><option>ABM</option><option>AHM</option><option>Others</option>
</select>
<select id="statusFilter" onchange="render()">
<option value="">All Status</option><option value="Pending">Pending</option><option value="Completed">Completed</option>
</select>
</div>

<div class="toolbar">
<button class="secondary" onclick="exportJSON()">Export Backup</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button>
<input id="importFile" type="file" accept=".json,application/json" hidden onchange="importJSON(event)">
</div>
<div id="taskList" class="tasks"></div>
</div>

<div class="modal-bg" id="formModal">
<div class="modal">
<h2 id="formTitle">Add Task</h2>
<form id="taskForm">
<input type="hidden" id="taskId">
<div class="field"><label>Colleague Name *</label><input id="colleague" required placeholder="Enter colleague name"></div>
<div class="form-grid">
<div class="field"><label>Entity *</label><select id="entity"><option>AIB</option><option>ABM</option><option>AHM</option><option>Others</option></select></div>
<div class="field"><label>Due Date</label><input type="date" id="dueDate"></div>
</div>
<div class="field"><label>Task Title *</label><input id="taskTitle" required placeholder="e.g. Laptop replacement"></div>
<div class="field"><label>New Laptop Serial Number</label><div class="serial-input"><input id="newSerial" placeholder="Enter serial number"><button type="button" class="secondary" onclick="openScanner('newSerial')">Scan</button></div></div>
<div class="field"><label>Old Laptop Serial Number</label><div class="serial-input"><input id="oldSerial" placeholder="Enter serial number"><button type="button" class="secondary" onclick="openScanner('oldSerial')">Scan</button></div></div>
<div class="field"><label>Notes (Optional)</label><textarea id="notes" placeholder="Additional information..."></textarea></div>
<div class="form-actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button type="submit" class="primary">Save Task</button></div>
</form>
</div>
</div>

<div class="modal-bg" id="scanModal">
<div class="modal">
<h2>Scan Laptop Serial Number</h2>
<p class="scan-help">Point the camera at the barcode labelled Serial Number. MAC Address and UUID will be ignored.</p>
<div id="reader"></div>
<p id="scanMessage" class="scan-help">Starting camera...</p>
<div class="form-actions"><button class="secondary" onclick="closeScanner()">Close Scanner</button></div>
</div>
</div>

<script>
const STORAGE_KEY="laptopReplacementTasks_v1";
let tasks=[];
let scanner=null;
let scanTarget=null;
let scanLocked=false;

try{tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));render()}
function getStatus(t){return t.replaceDone&&t.collectDone?"Completed":"Pending"}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
const search=document.getElementById("search").value.toLowerCase();
const entity=document.getElementById("entityFilter").value;
const status=document.getElementById("statusFilter").value;

document.getElementById("totalCount").textContent=tasks.length;
document.getElementById("pendingCount").textContent=tasks.filter(t=>getStatus(t)==="Pending").length;
document.getElementById("completedCount").textContent=tasks.filter(t=>getStatus(t)==="Completed").length;

const filtered=tasks.
filter(t=>{
const text=[t.colleague,t.title,t.entity,t.notes,t.newSerial,t.oldSerial].join(" ").toLowerCase();
return text.includes(search)&&(!entity||t.entity===entity)&&(!status||getStatus(t)===status);
});

const list=document.getElementById("taskList");
if(!filtered.length){list.innerHTML='<div class="empty">No tasks found. Add a task to get started.</div>';return}

list.innerHTML=filtered.map(t=>{
const state=getStatus(t);
return `
<article class="task">
<div class="task-top">
<div><h3>${escapeHTML(t.colleague)}</h3><div class="meta">${escapeHTML(t.entity)} · ${escapeHTML(t.title)}${t.dueDate?" · Due: "+escapeHTML(t.dueDate):""}</div></div>
<span class="pill ${state.toLowerCase()}">${state}</span>
</div>
<div class="serials">
<div class="serial"><strong>New Laptop Serial Number</strong>${escapeHTML(t.newSerial||"Not entered")}</div>
<div class="serial"><strong>Old Laptop Serial Number</strong>${escapeHTML(t.oldSerial||"Not entered")}</div>
</div>
<div class="checklist">
<label class="checkline"><input type="checkbox" ${t.replaceDone?"checked":""} onchange="updateCheck('${t.id}','replaceDone',this.checked)"><span>Replace / hand over new laptop</span></label>
<label class="checkline"><input type="checkbox" ${t.collectDone?"checked":""} onchange="updateCheck('${t.id}','collectDone',this.checked)"><span>Collect old laptop</span></label>
</div>
${t.notes?`<div class="notes">${escapeHTML(t.notes)}</div>`:""}
<div class="actions"><button class="secondary" onclick="editTask('${t.id}')">Edit</button><button class="danger" onclick="deleteTask('${t.id}')">Delete</button></div>
</article>`;
}).join("");
}

function openForm(){
document.getElementById("taskForm").reset();
document.getElementById("taskId").value="";
document.getElementById("formTitle").textContent="Add Task";
document.getElementById("formModal").classList.add("show");
}
function closeForm(){document.getElementById("formModal").classList.remove("show")}

document.getElementById("taskForm").addEventListener("submit",e=>{
e.preventDefault();
const id=document.getElementById("taskId").value;
const existing=tasks.find(t=>t.id===id);
const task={
id:id||String(Date.now())+Math.random().toString(16).slice(2),
colleague:document.getElementById("colleague").value.trim(),
entity:document.getElementById("entity").value,
dueDate:document.getElementById("dueDate").value,
title:document.getElementById("taskTitle").value.trim(),
newSerial:document.getElementById("newSerial").value.trim().toUpperCase(),
oldSerial:document.getElementById("oldSerial").value.trim().toUpperCase(),
notes:document.getElementById("notes").value.trim(),
replaceDone:existing?existing.replaceDone:false,
collectDone:existing?existing.collectDone:false
};
if(existing)tasks=tasks.map(t=>t.id===id?task:t);else tasks.unshift(task);
closeForm();save();
});

function editTask(id){
const t=tasks.find(x=>x.id===id);if(!t)return;
document.getElementById("taskId").value=t.id;
document.getElementById("colleague").value=t.colleague;
document.getElementById("entity").value=t.entity;
document.getElementById("dueDate").value=t.dueDate||"";
document.getElementById("taskTitle").value=t.title;
document.getElementById("newSerial").value=t.newSerial||"";
document.getElementById("oldSerial").value=t.oldSerial||"";
document.getElementById("notes").value=t.notes||"";
document.getElementById("formTitle").textContent="Edit Task";
document.getElementById("formModal").classList.add("show");
}

function deleteTask(id){
if(!confirm("Delete this task? This action cannot be undone."))return;
tasks=tasks.filter(t=>t.id!==id);save();
}

function updateCheck(id,field,checked){
const t=tasks.find(x=>x.id===id);if(!t)return;
t[field]=checked;save();
}

// Accept only the 10-character serial format from the example HP label.
function isValidSerial(value){return /^[A-Z0-9]{10}$/i.test(value.trim())}

async function openScanner(target){
scanTarget=target;scanLocked=false;
document.getElementById("scanMessage").textContent="Starting camera. Allow camera access when prompted.";
document.getElementById("scanModal").classList.add("show");
if(typeof Html5Qrcode==="undefined"){
document.getElementById("scanMessage").textContent="Scanner library could not load. Check your internet connection and reload.";
return;
}

try{
scanner=new Html5Qrcode("reader");
await scanner.start(
{facingMode:"environment"},
{fps:12,qrbox:{width:280,height:110},aspectRatio:1.777,
formatsToSupport:[
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.QR_CODE,
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.ITF
]},
decodedText=>{
if(scanLocked)return;
const serial=decodedText.trim().toUpperCase();
if(!isValidSerial(serial)){
document.getElementById("scanMessage").textContent="Not a valid Serial Number. MAC Address / UUID ignored. Keep scanning.";
return;
}
scanLocked=true;
document.getElementById(scanTarget).value=serial;
document.getElementById("scanMessage").textContent="Serial Number detected: "+serial;
closeScanner();
},
()=>{}
);
}catch(error){
document.getElementById("scanMessage").textContent="Unable to start camera. Check camera permission and make sure the page uses HTTPS.";
}
}

async function closeScanner(){
if(scanner){
try{if(scanner.isScanning)await scanner.stop();await scanner.clear()}catch(error){}
scanner=null;
}
document.getElementById("scanModal").classList.remove("show");
}

function toggleTheme(){
document.body.classList.toggle("dark");
const dark=document.body.classList.contains("dark");
localStorage.setItem("laptopTodoTheme",dark?"dark":"light");
updateThemeButton();
}
function updateThemeButton(){
document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?"Light Mode":"Dark Mode";
}
if(localStorage.getItem("laptopTodoTheme")==="dark")document.body.classList.add("dark");
updateThemeButton();

function exportJSON(){
const blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="laptop-replacement-backup.json";a.click();
URL.revokeObjectURL(url);
}

function importJSON(event){
const file=event.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const imported=JSON.parse(reader.result);
if(!Array.isArray(imported))throw new Error("Invalid format");
if(!confirm("Import backup? Existing tasks will be replaced."))return;
tasks=imported.map(t=>({
id:t.id||String(Date.now())+Math.random(),
colleague:String(t.colleague||""),
entity:["AIB","ABM","AHM","Others"].includes(t.entity)?t.entity:"Others",
dueDate:t.dueDate||"",title:String(t.title||""),
newSerial:String(t.newSerial||""),oldSerial:String(t.oldSerial||""),
notes:String(t.notes||""),replaceDone:Boolean(t.replaceDone),collectDone:Boolean(t.collectDone)
}));
save();alert("Backup imported successfully.");
}catch{alert("Unable to import. Please select a valid backup JSON file.")}
finally{event.target.value=""}
};
reader.readAsText(file);
}
render();
</script>
</body>
</html>
